<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rice or not?</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --green: #10B981;
      --red: #EF4444;
      --orange: #F59E0B;
      --today-blue: #0284C7;
      --today-bg: #F0F9FF;
      --border: #E2E8F0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 95px; }

    header {
      background: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { font-weight: 800; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 6px; }

    /* Enlarged Banner & Role Toggle */
    .user-banner {
      background: #E0E7FF;
      border-bottom: 2px solid #A5B4FC;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #312E81;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .banner-role-toggle {
      display: inline-flex;
      background: #C7D2FE;
      border-radius: 14px;
      padding: 3px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .banner-role-btn {
      border: none;
      background: transparent;
      padding: 6px 0;
      width: 72px;
      text-align: center;
      border-radius: 11px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #4338CA;
      cursor: pointer;
      transition: all 0.2s ease;
      opacity: 0.75;
    }

    .banner-role-btn.active {
      background: var(--primary);
      color: white;
      font-weight: 800;
      opacity: 1;
      box-shadow: 0 2px 5px rgba(79, 70, 229, 0.3);
    }

    .nav-tabs {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 4px 16px;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }

    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .tab-view { display: none; }
    .tab-view.active { display: block; }

    .coupon-alert-banner {
      background: #FEF3C7;
      border-bottom: 1px solid #FDE68A;
      color: #92400E;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .coupon-alert-item { display: flex; align-items: center; gap: 6px; }

    .btn-mode {
      background: white;
      border: 1px solid #A5B4FC;
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-mode.active { background: var(--primary); color: white; border-color: var(--primary); }

    .container { max-width: 500px; margin: 0 auto; padding: 12px; }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .nav-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .month-title { font-weight: 800; font-size: 0.88rem; }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 4px;
      gap: 3px;
    }

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px 3px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      aspect-ratio: 1 / 1.5;
      overflow: hidden;
    }

    .day-card.empty { background: transparent; border: none; cursor: default; }
    .day-card.today { border: 2px solid var(--today-blue); background: var(--today-bg); }
    .day-card.today .day-num { color: var(--today-blue); }
    .day-card.selected { border: 2px solid var(--primary); background: var(--primary-light); }

    .day-num { 
      font-size: 0.75rem; 
      font-weight: 800; 
      color: var(--text-muted); 
      line-height: 1; 
      position: absolute;
      top: 3px;
      left: 4px;
      z-index: 2;
    }

    .day-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
      padding-top: 17px;
    }

    .status-stack { 
      display: flex; 
      gap: 2px; 
      justify-content: center; 
      align-items: center; 
      height: 21px;
      margin-bottom: 2px;
    }
    
    .status-circle {
      font-size: 0.68rem;
      font-weight: 800;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
    }

    .status-yes { background-color: var(--green); }
    .status-no { background-color: var(--red); }
    .status-unset { background-color: #CBD5E1; color: #475569; }

    .remarks-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      overflow: hidden;
    }

    .remarks-box {
      font-size: 0.5rem;
      line-height: 1.1;
      color: var(--text);
      background: #F1F5F9;
      border-radius: 2px;
      padding: 1px 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      text-align: center;
      max-width: 100%;
      width: 100%;
    }

    .action-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      z-index: 90;
    }

    .action-btns { display: flex; gap: 6px; width: 100%; }

    .btn-action {
      flex: 1;
      padding: 10px 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-action.yes { background: #ECFDF5; color: var(--green); border-color: var(--green); }
    .btn-action.no { background: #FEF2F2; color: var(--red); border-color: var(--red); }
    .btn-action.edit { background: #EEF2FF; color: var(--primary); border-color: var(--primary); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
    }

    .detail-row {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .detail-user { font-weight: 800; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 2px; }
    .detail-val { font-weight: 700; font-size: 0.95rem; }

    .last-updated-badge {
      font-size: 0.72rem;
      color: var(--text-muted);
      background: #F1F5F9;
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 8px;
      display: inline-block;
      font-weight: 600;
    }

    .status-picker { display: flex; gap: 8px; margin-top: 12px; margin-bottom: 14px; }

    .status-option {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--bg);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }

    .status-option.selected-yes { border-color: var(--green); background: #ECFDF5; color: var(--green); }
    .status-option.selected-no { border-color: var(--red); background: #FEF2F2; color: var(--red); }
    .status-option.selected-clear { border-color: var(--text-muted); background: #F1F5F9; color: var(--text-muted); }

    .remark-input, .coupon-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 12px;
    }

    .btn-save {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-add-coupon {
      width: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #C7D2FE;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .btn-add-coupon:active {
      transform: scale(0.97);
      background: #E0E7FF;
    }

    .btn-edit-direct {
      width: 100%;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .coupon-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coupon-info { display: flex; flex-direction: column; gap: 2px; }
    .coupon-title { font-weight: 800; font-size: 0.95rem; color: var(--text); }
    .coupon-expiry { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }
    
    .badge-exp {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 2px;
    }
    .badge-warning { background: #FEF3C7; color: var(--orange); }
    .badge-danger { background: #FEF2F2; color: var(--red); }

    .btn-delete {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: var(--red);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .bill-header-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 10px;
    }

    .btn-export-out {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: #475569;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-export-out:active {
      transform: scale(0.96);
      background: #E2E8F0;
    }

    .bill-summary-card {
      background: linear-gradient(135deg, #4F46E5, #3730A3);
      color: white;
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }

    .bill-summary-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.85;
    }

    .bill-cycle-dates {
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.15);
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
    }

    .bill-summary-amount { font-size: 2rem; font-weight: 800; margin-top: 2px; }

    .bill-group-header {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 12px 0 6px 4px;
    }

    /* Wrap-enabled Compact Bill Card */
    .bill-item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .bill-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .bill-item-date { 
      font-size: 0.72rem; 
      font-weight: 700; 
      color: var(--text-muted); 
    }

    /* Text wrapping for descriptions */
    .bill-item-desc { 
      font-weight: 700; 
      font-size: 0.88rem; 
      color: var(--text); 
      line-height: 1.25;
      word-break: break-word;
      white-space: normal;
    }

    .bill-item-amount { 
      font-weight: 800; 
      font-size: 0.92rem; 
      color: var(--primary); 
      flex-shrink: 0;
      padding-top: 1px;
    }

    .bill-item-amount.deduct { color: var(--red); }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍚 Rice or not?</div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tabBtnCalendar" onclick="switchTab('calendar')">📅 Calendar</button>
    <button class="tab-btn" id="tabBtnCoupons" onclick="switchTab('coupons')">🎟️ Coupons</button>
    <button class="tab-btn" id="tabBtnBill" onclick="switchTab('bill')">💳 Monthly Bill</button>
  </div>

  <div id="calendarView" class="tab-view active">
    <div id="couponAlertBanner" class="coupon-alert-banner" style="display: none;"></div>

    <div class="user-banner">
      <div style="display: flex; align-items: center;">
        Editing as:
        <div class="banner-role-toggle">
          <button class="banner-role-btn" id="roleJoey" onclick="setRole('joey')">Joey</button>
          <button class="banner-role-btn active" id="roleCarmen" onclick="setRole('carmen')">Carmen</button>
        </div>
      </div>
      <button class="btn-mode" id="bulkToggleBtn" onclick="toggleBulkMode()">Select Multiple</button>
    </div>

    <div class="container">
      <div class="calendar-header">
        <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
        <div class="month-title" id="monthTitle">--</div>
        <button class="nav-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
      </div>

      <div class="weekdays">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <div id="couponsView" class="tab-view">
    <div class="container">
      <div style="display: flex; justify-content: flex-end;">
        <button class="btn-add-coupon" onclick="openAddCouponModal()">+ Add Coupon</button>
      </div>
      <div id="couponsList"></div>
    </div>
  </div>

  <div id="billView" class="tab-view">
    <div class="container">
      <div class="bill-header-bar">
        <button class="btn-export-out" onclick="exportBillAsImage()">
          📤 Export List
        </button>
      </div>

      <div id="billCaptureArea" style="background: var(--bg); padding: 4px; border-radius: var(--radius);">
        <div class="bill-summary-card">
          <div class="bill-summary-title">Total Payable</div>
          <div class="bill-cycle-dates" id="billCycleDates">Cycle: --</div>
          <div class="bill-summary-amount" id="billTotalAmount">$0</div>
        </div>
        <div id="billList"></div>
      </div>
    </div>
  </div>

  <div class="action-bar" id="actionBar" style="display: none;">
    <div class="action-btns">
      <button class="btn-action yes" onclick="batchUpdate('YES')">✓ Home (<span id="countYes">0</span>)</button>
      <button class="btn-action no" onclick="batchUpdate('NO')">✕ Out (<span id="countNo">0</span>)</button>
      <button class="btn-action edit" onclick="openEditModal()">✎ Edit Selected</button>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem; font-weight: 800;" id="detailTitle">Date Details</h3>
      
      <div class="detail-row">
        <div class="detail-user">JOEY</div>
        <div class="detail-val" id="detailJoey">--</div>
      </div>

      <div class="detail-row">
        <div class="detail-user">CARMEN</div>
        <div class="detail-val" id="detailCarmen">--</div>
      </div>

      <div id="detailLastUpdated"></div>

      <button class="btn-edit-direct" onclick="editCurrentSingleDate()">✎ Edit My Entry</button>
    </div>
  </div>

  <div class="modal" id="remarkModal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem; font-weight: 800;" id="modalTitle">Edit Details</h3>
      <div id="lastUpdatedBox"></div>
      
      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-top: 12px;">STATUS:</div>
      <div class="status-picker">
        <button class="status-option" id="optYes" onclick="selectModalStatus('YES')">✓ Home</button>
        <button class="status-option" id="optNo" onclick="selectModalStatus('NO')">✕ Out</button>
        <button class="status-option" id="optClear" onclick="selectModalStatus('')">↺ Clear</button>
      </div>

      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">REMARKS:</div>
      <input type="text" class="remark-input" id="remarkInput" placeholder="Add or edit remarks...">
      
      <button class="btn-save" id="saveBtn" onclick="confirmBatchSave()">Save Updates</button>
    </div>
  </div>

  <div class="modal" id="couponModal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 12px;">Add New Coupon</h3>
      
      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">COUPON NAME / STORE:</div>
      <input type="text" class="coupon-input" id="couponNameInput" placeholder="e.g., Wellcome $50 Voucher">

      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">EXPIRY DATE:</div>
      <input type="date" class="coupon-input" id="couponExpiryInput">

      <button class="btn-save" id="saveCouponBtn" onclick="saveCoupon()">Save Coupon</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMMwiLgqXued1vfMDe9W9tliRdhmlsXUi_a7pJGbI7p0CImpLCKqYg8O7P7OeM5EDoMg/exec";

    let monthOffset = 0;
    let dbData = {};
    let coupons = [];
    let billItems = [];
    let billCycle = { start: "", end: "" };
    let selectedDates = new Set();
    let pendingStatus = '';
    let currentUser = 'carmen';
    let isBulkMode = false;
    let activeSingleDate = null;

    const now = new Date();
    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth();

    function formatDateOnly(str) {
      if (!str) return '';
      const strVal = String(str).trim();
      if (strVal.match(/^\d{4}-\d{1,2}-\d{1,2}/)) {
        const parts = strVal.split('T')[0].split('-');
        const y = parseInt(parts[0], 10);
        const m = String(parseInt(parts[1], 10)).padStart(2, '0');
        const day = String(parseInt(parts[2], 10)).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      const d = new Date(strVal);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      return strVal;
    }

    function formatNumber1Dec(num) {
      const val = Number(num) || 0;
      return val.toFixed(1);
    }

    renderCalendar();
    fetchData();

    function switchTab(tab) {
      document.getElementById('tabBtnCalendar').classList.toggle('active', tab === 'calendar');
      document.getElementById('tabBtnCoupons').classList.toggle('active', tab === 'coupons');
      document.getElementById('tabBtnBill').classList.toggle('active', tab === 'bill');
      
      document.getElementById('calendarView').classList.toggle('active', tab === 'calendar');
      document.getElementById('couponsView').classList.toggle('active', tab === 'coupons');
      document.getElementById('billView').classList.toggle('active', tab === 'bill');

      if (tab === 'coupons' || tab === 'bill') {
        document.getElementById('actionBar').style.display = 'none';
      } else if (isBulkMode) {
        document.getElementById('actionBar').style.display = 'flex';
      }
    }

    async function fetchData() {
      const cachedData = localStorage.getItem('rice_db_data');
      const cachedCoupons = localStorage.getItem('rice_coupons');
      const cachedBill = localStorage.getItem('rice_bill');
      const cachedCycle = localStorage.getItem('rice_cycle');

      if (cachedData) {
        try { dbData = JSON.parse(cachedData); renderCalendar(); } catch (e) {}
      }
      if (cachedCoupons) {
        try { 
          coupons = JSON.parse(cachedCoupons); 
          renderCoupons(); 
          checkExpiringCoupons();
        } catch (e) {}
      }
      if (cachedBill) {
        try {
          billItems = JSON.parse(cachedBill);
          if (cachedCycle) billCycle = JSON.parse(cachedCycle);
          renderBill();
        } catch (e) {}
      }

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const freshData = await response.json();
        
        if (freshData) {
          if (freshData.calendar) {
            dbData = freshData.calendar;
            localStorage.setItem('rice_db_data', JSON.stringify(dbData));
            renderCalendar();
          }

          if (freshData.coupons) {
            coupons = freshData.coupons;
            localStorage.setItem('rice_coupons', JSON.stringify(coupons));
            renderCoupons();
            checkExpiringCoupons();
          }

          if (freshData.bill) {
            billItems = freshData.bill;
            if (freshData.cycle) billCycle = freshData.cycle;
            localStorage.setItem('rice_bill', JSON.stringify(billItems));
            localStorage.setItem('rice_cycle', JSON.stringify(billCycle));
            renderBill();
          }
        }
      } catch (e) {
        console.error("Error fetching data:", e);
      }
    }

    function checkExpiringCoupons() {
      const banner = document.getElementById('couponAlertBanner');
      if (!coupons || coupons.length === 0) {
        banner.style.display = 'none';
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const expiringList = coupons.filter(c => {
        const dateStr = formatDateOnly(c.expiry);
        const expDate = new Date(dateStr);
        const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
        return diffDays <= 7;
      });

      if (expiringList.length === 0) {
        banner.style.display = 'none';
        return;
      }

      banner.innerHTML = expiringList.map(c => {
        const dateStr = formatDateOnly(c.expiry);
        const expDate = new Date(dateStr);
        const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
        const statusText = diffDays < 0 ? 'is expired' : (diffDays === 0 ? 'expires today' : `expires in ${diffDays} day(s)`);
        
        return `<div class="coupon-alert-item">⚠️ <strong>[Coupon] ${c.name}</strong> ${statusText} on ${dateStr}!</div>`;
      }).join('');

      banner.style.display = 'flex';
    }

    function renderBill() {
      const list = document.getElementById('billList');
      const totalEl = document.getElementById('billTotalAmount');
      const cycleEl = document.getElementById('billCycleDates');

      const cleanStart = formatDateOnly(billCycle.start);
      const cleanEnd = formatDateOnly(billCycle.end);

      if (cleanStart && cleanEnd) {
        cycleEl.innerText = `Cycle: ${cleanStart} to ${cleanEnd}`;
      } else {
        cycleEl.innerText = `Cycle: Current Settlement`;
      }

      if (!billItems || billItems.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px; font-weight: 600;">No active items for this cycle!</div>`;
        totalEl.innerText = '$0';
        return;
      }

      const deductionItems = billItems.filter(i => i.deduct);
      const oneOffItems = billItems.filter(i => !i.recurring && !i.deduct);
      const recurringItems = billItems.filter(i => i.recurring && !i.deduct);

      const sortByDate = (a, b) => new Date(formatDateOnly(a.date)) - new Date(formatDateOnly(b.date));
      oneOffItems.sort(sortByDate);
      recurringItems.sort(sortByDate);
      deductionItems.sort(sortByDate);

      let total = 0;
      let html = '';

      const renderCard = (item, isDeduction = false) => {
        const amt = Number(item.amount) || 0;
        if (isDeduction) {
          total -= amt;
        } else {
          total += amt;
        }

        const formattedAmt = formatNumber1Dec(amt);
        const cleanDate = formatDateOnly(item.date);

        return `
          <div class="bill-item-card">
            <div class="bill-item-info">
              <span class="bill-item-date">${cleanDate}</span>
              <span class="bill-item-desc">${item.description || 'Expense'}</span>
            </div>
            <div class="bill-item-amount ${isDeduction ? 'deduct' : ''}">
              ${isDeduction ? '-' : ''}$${formattedAmt}
            </div>
          </div>
        `;
      };

      if (oneOffItems.length > 0) {
        html += `<div class="bill-group-header">One-off Expenses</div>`;
        html += oneOffItems.map(i => renderCard(i, false)).join('');
      }

      if (recurringItems.length > 0) {
        html += `<div class="bill-group-header">Recurring Items</div>`;
        html += recurringItems.map(i => renderCard(i, false)).join('');
      }

      if (deductionItems.length > 0) {
        html += `<div class="bill-group-header">Deductions</div>`;
        html += deductionItems.map(i => renderCard(i, true)).join('');
      }

      list.innerHTML = html;
      totalEl.innerText = `$${Math.round(total)}`;
    }

    async function exportBillAsImage() {
      const captureElement = document.getElementById('billCaptureArea');
      if (!captureElement) return;

      try {
        const canvas = await html2canvas(captureElement, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#F8FAFC'
        });

        const dateStr = billCycle.end ? formatDateOnly(billCycle.end) : new Date().toISOString().split('T')[0];
        const fileName = `Monthly_Bill_${dateStr}.jpg`;

        canvas.toBlob(async (blob) => {
          if (!blob) return;

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: 'image/jpeg' })] })) {
            try {
              const file = new File([blob], fileName, { type: 'image/jpeg' });
              await navigator.share({
                title: "Monthly Bill",
                files: [file]
              });
              return;
            } catch (shareErr) {
              if (shareErr.name === 'AbortError') return;
            }
          }

          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.download = fileName;
          link.href = url;
          link.click();
          URL.revokeObjectURL(url);
        }, 'image/jpeg', 0.85);

      } catch (err) {
        console.error('Failed to export image:', err);
        alert('Failed to generate image. Please try again.');
      }
    }

    function setRole(role) {
      currentUser = role;
      document.getElementById('roleJoey').classList.toggle('active', role === 'joey');
      document.getElementById('roleCarmen').classList.toggle('active', role === 'carmen');
      renderCalendar();
    }

    function toggleBulkMode() {
      isBulkMode = !isBulkMode;
      selectedDates.clear();
      updateActionBar();
      
      const btn = document.getElementById('bulkToggleBtn');
      btn.classList.toggle('active', isBulkMode);
      btn.innerText = isBulkMode ? 'Done Selecting' : 'Select Multiple';
      document.getElementById('actionBar').style.display = isBulkMode ? 'flex' : 'none';
      
      renderCalendar();
    }

    function handleDateClick(dateStr) {
      if (isBulkMode) {
        if (selectedDates.has(dateStr)) {
          selectedDates.delete(dateStr);
        } else {
          selectedDates.add(dateStr);
        }
        updateActionBar();
        renderCalendar();
      } else {
        openDayDetail(dateStr);
      }
    }

    function openDayDetail(dateStr) {
      activeSingleDate = dateStr;
      const dayData = dbData[dateStr] || {};
      
      const formatStatus = (st, rem) => {
        let text = st === 'YES' ? '✓ Home' : (st === 'NO' ? '✕ Out' : 'TBC');
        if (rem) text += ` — "${rem}"`;
        return text;
      };

      document.getElementById('detailTitle').innerText = dateStr;
      document.getElementById('detailJoey').innerText = formatStatus(dayData.joeyStatus, dayData.joeyRemarks);
      document.getElementById('detailCarmen').innerText = formatStatus(dayData.carmenStatus, dayData.carmenRemarks);

      const lastUpdatedBox = document.getElementById('detailLastUpdated');
      if (dayData.lastUpdated) {
        const formattedTime = new Date(dayData.lastUpdated).toLocaleString('en-US', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        lastUpdatedBox.innerHTML = `<span class="last-updated-badge">⏱ Last updated: ${formattedTime}</span>`;
      } else {
        lastUpdatedBox.innerHTML = '';
      }

      document.getElementById('detailModal').classList.add('open');
    }

    function editCurrentSingleDate() {
      closeDetailModal();
      selectedDates.clear();
      selectedDates.add(activeSingleDate);
      openEditModal();
    }

    function changeMonth(delta) {
      if (monthOffset + delta < 0 || monthOffset + delta > 2) return;
      monthOffset += delta;
      selectedDates.clear();
      updateActionBar();
      renderCalendar();
    }

    function updateActionBar() {
      const count = selectedDates.size;
      document.getElementById('countYes').innerText = count;
      document.getElementById('countNo').innerText = count;
    }

    function renderCalendar() {
      const targetDate = new Date(currentYear, currentMonth + monthOffset, 1);
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();

      document.getElementById('monthTitle').innerText = targetDate.toLocaleString('default', { month: 'long', year: 'numeric' });
      
      document.getElementById('prevBtn').disabled = monthOffset <= 0;
      document.getElementById('nextBtn').disabled = monthOffset >= 2;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div class="day-card empty"></div>`;
      }

      const todayStr = formatDateOnly(new Date());

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayData = dbData[dateStr] || {};
        
        const isToday = dateStr === todayStr;
        const isSelected = selectedDates.has(dateStr);

        const joeySt = dayData.joeyStatus || '';
        const carmenSt = dayData.carmenStatus || '';

        const joeyRem = (dayData.joeyRemarks || '').trim();
        const carmenRem = (dayData.carmenRemarks || '').trim();

        let remarksHtml = '';
        if (joeyRem) {
          remarksHtml += `<div class="remarks-box" title="J: ${joeyRem}">J:${joeyRem}</div>`;
        }
        if (carmenRem) {
          remarksHtml += `<div class="remarks-box" title="C: ${carmenRem}">C:${carmenRem}</div>`;
        }

        grid.innerHTML += `
          <div class="day-card ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="handleDateClick('${dateStr}')">
            <div class="day-num">${day}</div>
            <div class="day-content">
              <div class="status-stack">
                ${renderBadge('J', joeySt)}
                ${renderBadge('C', carmenSt)}
              </div>
              <div class="remarks-container">
                ${remarksHtml}
              </div>
            </div>
          </div>
        `;
      }
    }

    function renderBadge(shortName, status) {
      if (status === 'YES') return `<div class="status-circle status-yes" title="Home">${shortName}</div>`;
      if (status === 'NO') return `<div class="status-circle status-no" title="Out">${shortName}</div>`;
      return `<div class="status-circle status-unset" title="TBC">${shortName}</div>`;
    }

    function selectModalStatus(status) {
      pendingStatus = status;
      document.getElementById('optYes').className = 'status-option' + (status === 'YES' ? ' selected-yes' : '');
      document.getElementById('optNo').className = 'status-option' + (status === 'NO' ? ' selected-no' : '');
      document.getElementById('optClear').className = 'status-option' + (status === '' ? ' selected-clear' : '');

      if (status === '') {
        document.getElementById('remarkInput').value = '';
      }
    }

    function batchUpdate(status) {
      if (selectedDates.size === 0) {
        alert("Please select one or more days first!");
        return;
      }
      selectModalStatus(status);
      document.getElementById('remarkInput').value = '';
      openModal();
    }

    function openEditModal() {
      if (selectedDates.size === 0) {
        alert("Please select one or more days first!");
        return;
      }

      const lastUpdatedBox = document.getElementById('lastUpdatedBox');

      if (selectedDates.size === 1) {
        const singleDate = Array.from(selectedDates)[0];
        const dayData = dbData[singleDate] || {};
        const currentSt = currentUser === 'joey' ? (dayData.joeyStatus || '') : (dayData.carmenStatus || '');
        const currentRem = currentUser === 'joey' ? (dayData.joeyRemarks || '') : (dayData.carmenRemarks || '');

        selectModalStatus(currentSt);
        document.getElementById('remarkInput').value = currentRem;

        if (dayData.lastUpdated) {
          const formattedTime = new Date(dayData.lastUpdated).toLocaleString('en-US', {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          lastUpdatedBox.innerHTML = `<span class="last-updated-badge">⏱ Last updated: ${formattedTime}</span>`;
        } else {
          lastUpdatedBox.innerHTML = '';
        }
      } else {
        selectModalStatus('');
        document.getElementById('remarkInput').value = '';
        lastUpdatedBox.innerHTML = '';
      }

      openModal();
    }

    function openModal() {
      const displayUser = currentUser === 'joey' ? 'Joey' : 'Carmen';
      document.getElementById('modalTitle').innerText = `Edit ${selectedDates.size} day(s) for ${displayUser}`;
      document.getElementById('remarkModal').classList.add('open');
    }

    async function confirmBatchSave() {
      const remarks = pendingStatus === '' ? '' : document.getElementById('remarkInput').value.trim();
      const saveBtn = document.getElementById('saveBtn');
      const datesArray = Array.from(selectedDates);
      const nowIso = new Date().toISOString();

      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      datesArray.forEach(dateStr => {
        if (!dbData[dateStr]) dbData[dateStr] = {};
        
        if (currentUser === 'joey') {
          dbData[dateStr].joeyStatus = pendingStatus;
          dbData[dateStr].joeyRemarks = remarks;
        } else {
          dbData[dateStr].carmenStatus = pendingStatus;
          dbData[dateStr].carmenRemarks = remarks;
        }

        const jSt = dbData[dateStr].joeyStatus || '';
        const jRem = dbData[dateStr].joeyRemarks || '';
        const cSt = dbData[dateStr].carmenStatus || '';
        const cRem = dbData[dateStr].carmenRemarks || '';

        if (!jSt && !jRem && !cSt && !cRem) {
          delete dbData[dateStr];
        } else {
          dbData[dateStr].lastUpdated = nowIso;
        }
      });

      localStorage.setItem('rice_db_data', JSON.stringify(dbData));
      renderCalendar();

      try {
        const payload = JSON.stringify({
          user: currentUser,
          dates: datesArray,
          status: pendingStatus,
          remarks: remarks
        });

        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: payload
        });

        setTimeout(fetchData, 2000);
      } catch (err) {
        console.error("Save error:", err);
      }

      saveBtn.innerText = "Save Updates";
      saveBtn.disabled = false;
      
      document.getElementById('remarkInput').value = '';
      selectedDates.clear();
      updateActionBar();
      closeModal();
      renderCalendar();
    }

    function closeModal() {
      document.getElementById('remarkInput').value = '';
      document.getElementById('remarkModal').classList.remove('open');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('open');
    }

    /* COUPON FUNCTIONS */
    function renderCoupons() {
      const list = document.getElementById('couponsList');
      if (coupons.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px; font-weight: 600;">No coupons added yet!</div>`;
        return;
      }

      coupons.sort((a, b) => new Date(formatDateOnly(a.expiry)) - new Date(formatDateOnly(b.expiry)));

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      list.innerHTML = coupons.map((c, i) => {
        const cleanExpiry = formatDateOnly(c.expiry);
        const expDate = new Date(cleanExpiry);
        const diffDays = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
        
        let badgeHtml = '';
        if (diffDays < 0) {
          badgeHtml = `<span class="badge-exp badge-danger">Expired</span>`;
        } else if (diffDays <= 7) {
          badgeHtml = `<span class="badge-exp badge-warning">Expires in ${diffDays} day(s)</span>`;
        }

        return `
          <div class="coupon-card">
            <div class="coupon-info">
              <div class="coupon-title">${c.name}</div>
              <div class="coupon-expiry">Expires: ${cleanExpiry}</div>
              ${badgeHtml}
            </div>
            <button class="btn-delete" onclick="deleteCoupon(${i})">Used / Delete</button>
          </div>
        `;
      }).join('');
    }

    function openAddCouponModal() {
      document.getElementById('couponNameInput').value = '';
      document.getElementById('couponExpiryInput').value = '';
      document.getElementById('couponModal').classList.add('open');
    }

    async function saveCoupon() {
      const name = document.getElementById('couponNameInput').value.trim();
      const expiry = document.getElementById('couponExpiryInput').value;

      if (!name || !expiry) {
        alert("Please fill in both the coupon name and expiry date.");
        return;
      }

      coupons.push({ name, expiry });
      localStorage.setItem('rice_coupons', JSON.stringify(coupons));
      renderCoupons();
      checkExpiringCoupons();
      document.getElementById('couponModal').classList.remove('open');

      await syncCouponsToGoogle();
    }

    async function deleteCoupon(index) {
      if (confirm("Mark this coupon as used or delete it?")) {
        coupons.splice(index, 1);
        localStorage.setItem('rice_coupons', JSON.stringify(coupons));
        renderCoupons();
        checkExpiringCoupons();
        await syncCouponsToGoogle();
      }
    }

    async function syncCouponsToGoogle() {
      try {
        const payload = JSON.stringify({
          action: "updateCoupons",
          coupons: coupons
        });

        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: payload
        });

        setTimeout(fetchData, 2000);
      } catch (err) {
        console.error("Error syncing coupons:", err);
      }
    }

    document.getElementById('remarkModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('remarkModal')) closeModal();
    });

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('detailModal')) closeDetailModal();
    });

    document.getElementById('couponModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('couponModal')) document.getElementById('couponModal').classList.remove('open');
    });
  </script>
</body>
