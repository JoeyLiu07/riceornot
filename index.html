<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rice or not?</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --green: #10B981;
      --red: #EF4444;
      --border: #E2E8F0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      background: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { font-weight: 800; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 6px; }

    .role-toggle {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px;
      display: flex;
      gap: 2px;
    }

    .role-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    .role-btn.active {
      background: var(--primary);
      color: white;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 16px; }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .nav-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .month-title { font-weight: 800; font-size: 1.05rem; }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 76px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
    }

    .day-card.empty { background: transparent; border: none; cursor: default; }
    .day-card.today { border: 2px solid var(--primary); }
    
    .day-card.selected {
      border: 2px solid var(--primary);
      background: var(--primary-light);
    }

    .day-num { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); }

    .status-stack { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    
    /* Compact Circular Badge Styling for J and C */
    .status-circle {
      font-size: 0.65rem;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
    }

    .status-yes { background-color: var(--green); }
    .status-no { background-color: var(--red); }
    .status-unset { background-color: #E2E8F0; color: var(--text-muted); }

    .remark-dot {
      width: 4px;
      height: 4px;
      background: #000;
      border: 1px solid #FFF;
      border-radius: 50%;
      position: absolute;
      top: 0;
      right: 0;
    }

    .action-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      z-index: 90;
    }

    .action-btns {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-action.yes { background: #ECFDF5; color: var(--green); border-color: var(--green); }
    .btn-action.no { background: #FEF2F2; color: var(--red); border-color: var(--red); }
    
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
    }

    .remark-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-top: 12px;
      margin-bottom: 16px;
    }

    .btn-save {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍚 Rice or not?</div>
    <div class="role-toggle">
      <button class="role-btn active" id="roleJoey" onclick="setRole('joey')">Joey</button>
      <button class="role-btn" id="roleCarmen" onclick="setRole('carmen')">Carmen</button>
    </div>
  </header>

  <div class="container">
    <div class="calendar-header">
      <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="monthTitle">--</div>
      <button class="nav-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
    </div>

    <div class="weekdays">
      <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="action-bar" id="actionBar">
    <div class="action-btns">
      <button class="btn-action yes" onclick="batchUpdate('YES')">✓ Home (<span id="selectedCountYes">0</span>)</button>
      <button class="btn-action no" onclick="batchUpdate('NO')">✕ Out (<span id="selectedCountNo">0</span>)</button>
    </div>
  </div>

  <div class="modal" id="remarkModal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem; font-weight: 800;" id="modalTitle">Set Remarks</h3>
      <input type="text" class="remark-input" id="remarkInput" placeholder="Add optional remarks for selected dates...">
      <button class="btn-save" id="saveBtn" onclick="confirmBatchSave()">Save Updates</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzibHJyOQpLgOyV3RNT-miBNyPH-5cPOystW1oA3NXcusHncWuYOErEfIPpmlCUFsT9AQ/exec";

    let monthOffset = 0;
    let dbData = {};
    let selectedDates = new Set();
    let pendingStatus = '';
    let currentUser = 'joey';

    const now = new Date();
    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth();

    renderCalendar();

    async function fetchData() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        dbData = await response.json();
        renderCalendar();
      } catch (e) {
        console.error("Error fetching data:", e);
      }
    }

    function setRole(role) {
      currentUser = role;
      document.getElementById('roleJoey').classList.toggle('active', role === 'joey');
      document.getElementById('roleCarmen').classList.toggle('active', role === 'carmen');
    }

    function changeMonth(delta) {
      if (monthOffset + delta < 0 || monthOffset + delta > 2) return;
      monthOffset += delta;
      selectedDates.clear();
      updateActionBar();
      renderCalendar();
    }

    function toggleDateSelection(dateStr) {
      if (selectedDates.has(dateStr)) {
        selectedDates.delete(dateStr);
      } else {
        selectedDates.add(dateStr);
      }
      updateActionBar();
      renderCalendar();
    }

    function updateActionBar() {
      const count = selectedDates.size;
      document.getElementById('selectedCountYes').innerText = count;
      document.getElementById('selectedCountNo').innerText = count;
    }

    function renderCalendar() {
      const targetDate = new Date(currentYear, currentMonth + monthOffset, 1);
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();

      document.getElementById('monthTitle').innerText = targetDate.toLocaleString('default', { month: 'long', year: 'numeric' });
      
      document.getElementById('prevBtn').disabled = monthOffset <= 0;
      document.getElementById('nextBtn').disabled = monthOffset >= 2;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div class="day-card empty"></div>`;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayData = dbData[dateStr] || {};
        
        const isToday = dateStr === todayStr;
        const isSelected = selectedDates.has(dateStr);

        const joeySt = dayData.joeyStatus || '';
        const carmenSt = dayData.carmenStatus || '';

        grid.innerHTML += `
          <div class="day-card ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="toggleDateSelection('${dateStr}')">
            <div class="day-num">${day}</div>
            <div class="status-stack">
              ${renderBadge('J', joeySt, dayData.joeyRemarks)}
              ${renderBadge('C', carmenSt, dayData.carmenRemarks)}
            </div>
          </div>
        `;
      }
    }

    function renderBadge(shortName, status, remarks) {
      const dot = remarks ? '<span class="remark-dot"></span>' : '';
      if (status === 'YES') {
        return `<div class="status-circle status-yes" title="Home">${shortName}${dot}</div>`;
      }
      if (status === 'NO') {
        return `<div class="status-circle status-no" title="Out">${shortName}${dot}</div>`;
      }
      return `<div class="status-circle status-unset">${shortName}</div>`;
    }

    function batchUpdate(status) {
      if (selectedDates.size === 0) {
        alert("Please tap one or more days first!");
        return;
      }
      pendingStatus = status;
      const displayUser = currentUser === 'joey' ? 'Joey' : 'Carmen';
      document.getElementById('modalTitle').innerText = `Update ${selectedDates.size} day(s) for ${displayUser} to "${status === 'YES' ? 'Home' : 'Out'}"`;
      document.getElementById('remarkInput').value = '';
      document.getElementById('remarkModal').classList.add('open');
    }

    async function confirmBatchSave() {
      const remarks = document.getElementById('remarkInput').value;
      const saveBtn = document.getElementById('saveBtn');
      const datesArray = Array.from(selectedDates);
      const nowIso = new Date().toISOString();

      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      datesArray.forEach(dateStr => {
        if (!dbData[dateStr]) dbData[dateStr] = {};
        if (currentUser === 'joey') {
          dbData[dateStr].joeyStatus = pendingStatus;
          if (remarks) dbData[dateStr].joeyRemarks = remarks;
        } else {
          dbData[dateStr].carmenStatus = pendingStatus;
          if (remarks) dbData[dateStr].carmenRemarks = remarks;
        }
        dbData[dateStr].lastUpdated = nowIso;
      });

      renderCalendar();

      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          user: currentUser,
          dates: datesArray,
          status: pendingStatus,
          remarks: remarks
        })
      });

      saveBtn.innerText = "Save Updates";
      saveBtn.disabled = false;
      
      selectedDates.clear();
      updateActionBar();
      closeModal();
      renderCalendar();
    }

    function closeModal() {
      document.getElementById('remarkModal').classList.remove('open');
    }

    document.getElementById('remarkModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('remarkModal')) closeModal();
    });

    fetchData();
  </script>
</body>
</html>
