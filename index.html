<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dinner Dex</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --green: #10B981;
      --green-bg: #ECFDF5;
      --red: #EF4444;
      --red-bg: #FEF2F2;
      --border: #E2E8F0;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }

    header {
      background: var(--card-bg);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { font-weight: 800; font-size: 1.2rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    
    .role-selector {
      background: var(--bg);
      padding: 4px;
      border-radius: 99px;
      display: flex;
      border: 1px solid var(--border);
    }

    .role-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .role-btn.active { background: var(--primary); color: white; }

    .container { max-width: 500px; margin: 0 auto; padding: 16px; }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .nav-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .month-title { font-weight: 800; font-size: 1.05rem; }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 76px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .day-card.empty { background: transparent; border: none; cursor: default; }
    .day-card.today { border: 2px solid var(--primary); }

    .day-num { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); }

    .status-stack { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
    
    .status-pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-yes { background: var(--green-bg); color: var(--green); }
    .status-no { background: var(--red-bg); color: var(--red); }
    .status-unset { background: var(--bg); color: var(--text-muted); }

    .remark-dot {
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.1);
    }

    .modal-header { font-weight: 800; font-size: 1.1rem; margin-bottom: 16px; }

    .toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--bg);
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .toggle-btn.yes.active { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .toggle-btn.no.active { background: var(--red-bg); border-color: var(--red); color: var(--red); }

    .remark-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
    }

    .btn-save {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .info-box {
      margin-top: 16px;
      padding: 12px;
      background: var(--bg);
      border-radius: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .timestamp-box {
      margin-top: 10px;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: right;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍽️ DinnerDex</div>
    <div class="role-selector">
      <button class="role-btn active" id="btnJoey" onclick="setRole('joey')">Joey</button>
      <button class="role-btn" id="btnCarmen" onclick="setRole('carmen')">Carmen</button>
    </div>
  </header>

  <div class="container">
    <div class="calendar-header">
      <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="monthTitle">--</div>
      <button class="nav-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
    </div>

    <div class="weekdays">
      <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="modal" id="dayModal">
    <div class="modal-content">
      <div class="modal-header" id="modalDateTitle">Date</div>
      
      <div class="toggle-group">
        <button class="toggle-btn yes" id="btnYes" onclick="setSelectStatus('YES')">✓ Home</button>
        <button class="toggle-btn no" id="btnNo" onclick="setSelectStatus('NO')">✕ Out</button>
      </div>

      <input type="text" class="remark-input" id="remarkInput" placeholder="Add remarks (e.g., dining out with friends)...">

      <button class="btn-save" id="saveBtn" onclick="saveData()">Save Choice</button>

      <div class="info-box" id="modalOtherInfo"></div>
      <div class="timestamp-box" id="modalTimestamp"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvg1XlH4HO5EDHiajZ5NSjuMx1dVdWETJJo2JLwJ9-Xh96NUt8fCPWUEVI-UVk5kTeMQ/exec";

    let currentRole = 'joey';
    let monthOffset = 0;
    let dbData = {};
    let selectedDateStr = null;
    let selectedStatus = '';

    const now = new Date();
    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth();

    function setRole(role) {
      currentRole = role;
      document.getElementById('btnJoey').classList.toggle('active', role === 'joey');
      document.getElementById('btnCarmen').classList.toggle('active', role === 'carmen');
      renderCalendar();
    }

    async function fetchData() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        dbData = await response.json();
        renderCalendar();
      } catch (e) {
        console.error("Error fetching data:", e);
      }
    }

    function changeMonth(delta) {
      if (monthOffset + delta < 0 || monthOffset + delta > 2) return;
      monthOffset += delta;
      renderCalendar();
    }

    function renderCalendar() {
      const targetDate = new Date(currentYear, currentMonth + monthOffset, 1);
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();

      document.getElementById('monthTitle').innerText = targetDate.toLocaleString('default', { month: 'long', year: 'numeric' });
      
      document.getElementById('prevBtn').disabled = monthOffset <= 0;
      document.getElementById('nextBtn').disabled = monthOffset >= 2;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div class="day-card empty"></div>`;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayData = dbData[dateStr] || {};
        
        const isToday = dateStr === todayStr;

        const joeySt = dayData.joeyStatus || '';
        const carmenSt = dayData.carmenStatus || '';

        grid.innerHTML += `
          <div class="day-card ${isToday ? 'today' : ''}" onclick="openModal('${dateStr}')">
            <div class="day-num">${day}</div>
            <div class="status-stack">
              <div class="status-pill ${getBadgeClass(joeySt)}">
                <span>Joey: ${getBadgeIcon(joeySt)}</span>
                ${dayData.joeyRemarks ? '<span class="remark-dot"></span>' : ''}
              </div>
              <div class="status-pill ${getBadgeClass(carmenSt)}">
                <span>Carmen: ${getBadgeIcon(carmenSt)}</span>
                ${dayData.carmenRemarks ? '<span class="remark-dot"></span>' : ''}
              </div>
            </div>
          </div>
        `;
      }
    }

    function getBadgeClass(status) {
      if (status === 'YES') return 'status-yes';
      if (status === 'NO') return 'status-no';
      return 'status-unset';
    }

    function getBadgeIcon(status) {
      if (status === 'YES') return '✓';
      if (status === 'NO') return '✕';
      return '-';
    }

    function openModal(dateStr) {
      selectedDateStr = dateStr;
      const dayData = dbData[dateStr] || {};
      
      document.getElementById('modalDateTitle').innerText = new Date(dateStr + 'T00:00:00').toLocaleDateString('default', { weekday: 'short', month: 'short', day: 'numeric' });

      selectedStatus = currentRole === 'joey' ? (dayData.joeyStatus || '') : (dayData.carmenStatus || '');
      document.getElementById('remarkInput').value = currentRole === 'joey' ? (dayData.joeyRemarks || '') : (dayData.carmenRemarks || '');

      updateToggleUI();

      const otherName = currentRole === 'joey' ? "Carmen" : "Joey";
      const otherStatus = currentRole === 'joey' ? dayData.carmenStatus : dayData.joeyStatus;
      const otherRemark = currentRole === 'joey' ? dayData.carmenRemarks : dayData.joeyRemarks;

      document.getElementById('modalOtherInfo').innerHTML = `
        <strong>${otherName}'s Plan:</strong> ${otherStatus ? (otherStatus === 'YES' ? '✓ Home for dinner' : '✕ Out') : 'Not decided yet'}<br>
        ${otherRemark ? `<em>"${otherRemark}"</em>` : ''}
      `;

      const lastUpdatedText = dayData.lastUpdated 
        ? `Last updated: ${new Date(dayData.lastUpdated).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`
        : 'No updates recorded yet';
      document.getElementById('modalTimestamp').innerText = lastUpdatedText;

      document.getElementById('dayModal').classList.add('open');
    }

    function setSelectStatus(st) {
      selectedStatus = selectedStatus === st ? '' : st;
      updateToggleUI();
    }

    function updateToggleUI() {
      document.getElementById('btnYes').classList.toggle('active', selectedStatus === 'YES');
      document.getElementById('btnNo').classList.toggle('active', selectedStatus === 'NO');
    }

    async function saveData() {
      const remarks = document.getElementById('remarkInput').value;
      const saveBtn = document.getElementById('saveBtn');
      const nowIso = new Date().toISOString();
      
      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      if (!dbData[selectedDateStr]) dbData[selectedDateStr] = {};
      if (currentRole === 'joey') {
        dbData[selectedDateStr].joeyStatus = selectedStatus;
        dbData[selectedDateStr].joeyRemarks = remarks;
      } else {
        dbData[selectedDateStr].carmenStatus = selectedStatus;
        dbData[selectedDateStr].carmenRemarks = remarks;
      }
      dbData[selectedDateStr].lastUpdated = nowIso;
      
      renderCalendar();

      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          user: currentRole,
          date: selectedDateStr,
          status: selectedStatus,
          remarks: remarks
        })
      });

      saveBtn.innerText = "Save Choice";
      saveBtn.disabled = false;
      closeModal();
    }

    function closeModal() {
      document.getElementById('dayModal').classList.remove('open');
    }

    document.getElementById('dayModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('dayModal')) closeModal();
    });

    fetchData();
  </script>
</body>
</html>
